name: GitHub Profile Summary Cards

on:
  schedule:
    # Roda todo dia às 00:00 UTC — atualiza stats automaticamente
    - cron: "0 0 * * *"
  workflow_dispatch: # permite rodar manualmente pela UI do GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    name: Gerar cards de stats

    steps:
      - uses: actions/checkout@v3

      - name: GitHub Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: wigodz

      - name: Commit e push dos cards gerados
        uses: EndBug/add-and-commit@v7
        with:
          add: "profile-summary-card-output"
          message: "chore: atualizar cards de stats [skip ci]"
          default_author: github_actions
